name: Auto Daily Shorts Generator

on:
  schedule:
    # يومياً الساعة 16:00 بتوقيت UTC (6 مساءً بتوقيت مصر)
    - cron: '0 16 * * *'
  # يتيح لك التشغيل اليدوي للتجربة في أي وقت
  workflow_dispatch:

jobs:
  build_and_upload:
    # بيئة تشغيل نظيفة في كل مرة
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          # بيجبره يسحب أحدث نسخة من الكود
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # منع الكاش تماماً لضمان تحميل المكتبات الجديدة
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python app.py
