name: Automated Trending Content Engine

on:
  schedule:
    # 4 شورتس في أوقات الذروة العالمية (08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 16 * * *'
    - cron: '0 20 * * *'
    # فيديوهين طوال (14:00, 22:00 UTC)
    - cron: '0 14 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Type of Video (short or long)'
        required: true
        default: 'short'

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script for Shorts or Long Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          # التمييز بين أنواع التشغيل
          if [ "${{ github.event.inputs.video_type }}" == "long" ]; then
            python app.py long
          else
            python app.py short
          fi
