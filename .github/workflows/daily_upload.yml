name: Automated Trending Content Engine

on:
  schedule:
    # --- 1. ذروة آسيا والهند (04:00 - 09:00 UTC) ---
    - cron: '12 5 * * *'   # Shorts: 10:42 AM الهند | 08:12 AM مصر
    - cron: '37 8 * * *'   # Shorts: 02:07 PM الهند | 11:37 AM مصر

    # --- 2. ذروة أوروبا (11:00 - 16:00 UTC) ---
    - cron: '18 12 * * *'  # Shorts: 01:18 PM لندن | 03:18 PM مصر
    - cron: '42 14 * * *'  # Shorts: 03:42 PM لندن | 05:42 PM مصر
    - cron: '15 15 * * *'  # Long Video #1: 04:15 PM لندن | 06:15 PM مصر

    # --- 3. ذروة أمريكا الشمالية (17:00 - 02:00 UTC) ---
    - cron: '23 17 * * *'  # Shorts: 01:23 PM نيويورك | 08:23 PM مصر
    - cron: '47 19 * * *'  # Shorts: 03:47 PM نيويورك | 10:47 PM مصر
    - cron: '11 21 * * *'  # Shorts: 05:11 PM نيويورك | 11:11 PM مصر
    - cron: '34 23 * * *'  # Shorts: 07:34 PM نيويورك | 01:34 AM مصر
    - cron: '52 1 * * *'   # Long Video #2: 09:52 PM نيويورك | 03:52 AM مصر

  workflow_dispatch:
    inputs:
      video_type:
        description: 'Type of Video (short or long)'
        required: true
        default: 'short'

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Script for Shorts or Long Video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.video_type }}" == "long" ]; then
            python app.py long
          else
            python app.py short
          fi
